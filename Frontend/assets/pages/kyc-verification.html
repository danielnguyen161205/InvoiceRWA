<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../css/tailwind.generated.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <script src="../js/i18n.js"></script>
    <title>KYC Verification</title>
</head>
<body class="bg-gray-50">

    <!-- Language Switcher (Top Right) -->
    <div class="fixed top-4 right-4 z-50 flex items-center space-x-2 bg-white rounded-lg shadow-md p-1">
        <button class="lang-btn px-3 py-1.5 text-sm font-medium rounded transition-all duration-200" data-lang="vi">
            🇻🇳 VI
        </button>
        <button class="lang-btn px-3 py-1.5 text-sm font-medium rounded transition-all duration-200" data-lang="en">
            🇬🇧 EN
        </button>
    </div>

    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-4xl w-full bg-white rounded-lg shadow-lg p-8">
            
            <!-- Header -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900">KYC Verification</h1>
                <p class="mt-2 text-sm text-gray-600">Know Your Customer - Business Verification</p>
                <p class="mt-1 text-xs text-gray-500">Complete all required information to access the invoice platform</p>
            </div>

            <!-- Status Message -->
            <div id="statusMessage" class="mb-6 hidden"></div>

            <!-- KYC Form -->
            <form id="kycForm" class="space-y-8">
                
                <!-- Section 1: Thông tin doanh nghiệp -->
                <div class="border-b border-gray-200 pb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">1. Thông tin doanh nghiệp</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        
                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tên doanh nghiệp *</label>
                            <input type="text" id="legal_name" required 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tên doanh nghiệp (tiếng nước ngoài)</label>
                            <input type="text" id="foreign_name" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tên viết tắt</label>
                            <input type="text" id="trade_name" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Mã số doanh nghiệp (MST) *</label>
                            <input type="text" id="tax_id" required 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <p class="mt-1 text-xs text-gray-500">
                                <a href="https://tracuunnt.gdt.gov.vn/tcnnt/mstcn.jsp" target="_blank" class="text-indigo-600 hover:underline">
                                    <i class="ri-external-link-line"></i> Kiểm tra tại đây
                                </a>
                            </p>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Mã số đăng ký kinh doanh</label>
                            <input type="text" id="registration_number" 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Loại hình pháp lý *</label>
                            <select id="legal_form" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="">Chọn loại hình</option>
                                <option value="Công ty TNHH">Công ty TNHH</option>
                                <option value="Công ty cổ phần">Công ty cổ phần</option>
                                <option value="Doanh nghiệp tư nhân">Doanh nghiệp tư nhân</option>
                                <option value="Hợp tác xã">Hợp tác xã</option>
                                <option value="Công ty liên doanh">Công ty liên doanh</option>
                                <option value="Chi nhánh">Chi nhánh</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Tình trạng hoạt động *</label>
                            <select id="operation_status" required 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="">Chọn tình trạng</option>
                                <option value="Đang hoạt động">Đang hoạt động</option>
                                <option value="Tạm ngưng">Tạm ngưng</option>
                                <option value="Ngừng hoạt động">Ngừng hoạt động</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Ngày bắt đầu thành lập *</label>
                            <input type="date" id="establishment_date" required 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Người đại diện pháp luật *</label>
                            <input type="text" id="legal_representative" required 
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                            <p class="mt-1 text-xs text-gray-500">
                                <a href="https://dangkykinhdoanh.gov.vn/vn/Pages/Trangchu.aspx" target="_blank" class="text-indigo-600 hover:underline">
                                    <i class="ri-external-link-line"></i> Kiểm tra tại đây
                                </a>
                            </p>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-medium text-gray-700 mb-2">Địa chỉ trụ sở chính *</label>
                            <textarea id="address" required rows="2"
                                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Section 2: Hồ sơ pháp lý -->
                <div class="border-b border-gray-200 pb-6">
                    <h2 class="text-xl font-semibold text-gray-800 mb-4">2. Hồ sơ pháp lý doanh nghiệp</h2>
                    <div class="space-y-4">
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Trạng thái MST (từ tracuunnt.gdt.gov.vn)</label>
                            <select id="tax_verification_status" 
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="">Chọn trạng thái</option>
                                <option value="Đang hoạt động">Đang hoạt động</option>
                                <option value="Ngừng hoạt động">Ngừng hoạt động</option>
                                <option value="Tạm ngừng">Tạm ngừng</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Thông tin tài khoản ngân hàng *</label>
                            <textarea id="bank_account_info" required rows="3" placeholder="Tên ngân hàng, số tài khoản, tên chủ tài khoản..."
                                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Danh sách người được ủy quyền</label>
                            <textarea id="authorized_persons_list" rows="3" 
                                      placeholder="Họ tên, chức vụ, phạm vi quyền hạn..."
                                      class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end space-x-4">
                    <button type="button" onclick="logout()" 
                            class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">
                        Đăng xuất
                    </button>
                    <button type="submit" id="submitBtn"
                            class="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold">
                        Gửi hồ sơ KYC
                    </button>
                </div>
            </form>

        </div>
    </div>

    <!-- Core Scripts -->
    <!--=============== CONFIG (MUST LOAD FIRST) ===============-->
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils/constants.js"></script>
    <script src="../js/components/notification.js"></script>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        const token = localStorage.getItem('token');

        // Get user role from token
        let userRole = 'SME';
        if (token) {
            const payload = JSON.parse(atob(token.split('.')[1]));
            const roles = payload.roles || (payload.role ? [payload.role] : []);
            if (roles.includes('BUYER')) userRole = 'BUYER';
            if (roles.includes('SME')) userRole = 'SME';
        }

        // Check authentication
        if (!token) {
            window.location.href = '/pages/login.html';
        }

        // Check KYC status on page load
        async function checkKYCStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/kyc/organization`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const org = await response.json();
                    displayStatus(org.status);
                }
            } catch (error) {
                console.error('Error checking KYC status:', error);
            }
        }

        // Display status message
        function displayStatus(status) {
            const statusDiv = document.getElementById('statusMessage');
            const form = document.getElementById('kycForm');
            
            statusDiv.classList.remove('hidden');

            if (status === 'PENDING' || status === 'UNDER_REVIEW') {
                statusDiv.className = 'mb-6 p-4 rounded-lg bg-yellow-50 border border-yellow-200';
                statusDiv.innerHTML = '<p class="text-yellow-800"><i class="ri-time-line"></i> Hồ sơ KYC của bạn đang được xem xét. Vui lòng chờ admin phê duyệt.</p>';
                form.style.display = 'none';
            } else if (status === 'REJECTED') {
                statusDiv.className = 'mb-6 p-4 rounded-lg bg-red-50 border border-red-200';
                statusDiv.innerHTML = '<p class="text-red-800"><i class="ri-error-warning-line"></i> Hồ sơ KYC bị từ chối. Vui lòng liên hệ support.</p>';
                form.style.display = 'none';
            } else if (status === 'APPROVED') {
                window.location.href = '/assets/pages/sme-dashboard.html';
            }
        }

        // Submit KYC form
        document.getElementById('kycForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Đang gửi...';

            try {
                // Collect form data
                const formData = {
                    org_type: userRole,
                    legal_name: document.getElementById('legal_name').value,
                    foreign_name: document.getElementById('foreign_name').value || null,
                    trade_name: document.getElementById('trade_name').value || null,
                    tax_id: document.getElementById('tax_id').value,
                    registration_number: document.getElementById('registration_number').value || null,
                    legal_form: document.getElementById('legal_form').value,
                    operation_status: document.getElementById('operation_status').value,
                    establishment_date: document.getElementById('establishment_date').value,
                    legal_representative: document.getElementById('legal_representative').value,
                    address: document.getElementById('address').value,
                    tax_verification_status: document.getElementById('tax_verification_status').value || null,
                    bank_account_info: document.getElementById('bank_account_info').value,
                    authorized_persons_list: document.getElementById('authorized_persons_list').value || null
                };

                // Submit organization data
                const response = await fetch(`${API_BASE_URL}/kyc/organization`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Failed to submit KYC form');
                }

                const result = await response.json();
                
                alert('✅ Hồ sơ KYC đã được gửi thành công!\n\nVui lòng chờ admin xem xét và phê duyệt.');
                checkKYCStatus();
                
            } catch (error) {
                console.error('Error submitting KYC:', error);
                alert('❌ Lỗi khi gửi hồ sơ KYC: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Gửi hồ sơ KYC';
            }
        });

        // Logout function
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/pages/login.html';
        }

        // Check status on page load
        checkKYCStatus();
    </script>

</body>
</html>
