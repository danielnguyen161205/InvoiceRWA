<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Bank Review | Invoice RWA</title>
	<link rel="stylesheet" href="../css/tailwind.generated.css">
	<link rel="stylesheet" href="../css/style.css">
</head>
<body>
	<header class="header">
		<h2>Bank Review Dashboard</h2>
		<button onclick="logout()">Logout</button>
	</header>

	<main>
		<p>This is the bank review area. Only users with role BANK should use this.</p>
	</main>

	<script src="../js/auth-guard.js"></script>
	<script src="../js/api.js"></script>
	<script>
		const token = localStorage.getItem('token');
		if (!token) location.href = '/pages/login.html';
		const payload = JSON.parse(atob(token.split('.')[1]));
		const roles = payload.roles || (payload.role ? [payload.role] : []);
		if (!roles.includes('BANK')) {
			alert('Access denied: BANK only');
			location.href = '/pages/login.html';
		}
	</script>
</body>
</html>
