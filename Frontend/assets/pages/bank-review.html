<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Bank Review | Invoice RWA</title>
	<link rel="stylesheet" href="../css/tailwind.generated.css">
	<link rel="stylesheet" href="../css/style.css">
	<script src="../js/i18n.js"></script>
</head>
<body>
	<!-- Language Switcher (Top Right) -->
	<div class="fixed top-4 right-4 z-50 flex items-center space-x-2 bg-white rounded-lg shadow-md p-1">
		<button class="lang-btn px-3 py-1.5 text-sm font-medium rounded transition-all duration-200" data-lang="vi">
			🇻🇳 VI
		</button>
		<button class="lang-btn px-3 py-1.5 text-sm font-medium rounded transition-all duration-200" data-lang="en">
			🇬🇧 EN
		</button>
	</div>

	<header class="header">
		<h2>Bank Review Dashboard</h2>
		<button onclick="logout()">Logout</button>
	</header>

	<main>
		<p>This is the bank review area. Only users with role BANK should use this.</p>
	</main>

	<!--=============== CONFIG (MUST LOAD FIRST) ===============-->
	<script src="../js/config.js"></script>
	<script src="../js/auth-guard.js"></script>
	<script src="../js/api.js"></script>
	<script>
		const token = localStorage.getItem('token');
		if (!token) location.href = '/pages/login.html';
		const payload = JSON.parse(atob(token.split('.')[1]));
		const roles = payload.roles || (payload.role ? [payload.role] : []);
		if (!roles.includes('BANK')) {
			alert('Access denied: BANK only');
			location.href = '/pages/login.html';
		}
	</script>
</body>
</html>
